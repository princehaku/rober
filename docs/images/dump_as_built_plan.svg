<text x="52" y="1064.76" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#2584b5">受力路径：斗 / 丝杆 → 连续固定框 → 四根支柱 → 底盘；推杆下端不压电子板。</text>
<text x="52" y="1109.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#243449">先按净空试装二层框与空斗；相机独立固定一层，雷达扫描面高于运输包络。</text>
<text x="52" y="1175.6" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#738091">0.7 kg原车与0.5 kg载荷仅为设计输入；实际加装后的重心、晃动与承载需复核。</text>
